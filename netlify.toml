[build]
publish = "public"
command = "echo 'Frontend deployment'"

[build.environment]
NODE_VERSION = "20"
SKIP_DEPS = "true"

# Proxy API and backend routes to the Render backend so Netlify serves frontend only
[[redirects]]
from = "/api/*"
to = "https://samuel-ai-tools-app.onrender.com/api/:splat"
status = 200
force = true

[[redirects]]
from = "/Tools/*"
to = "https://samuel-ai-tools-app.onrender.com/Tools/:splat"
status = 200
force = true

[[redirects]]
from = "/Games/*"
to = "https://samuel-ai-tools-app.onrender.com/Games/:splat"
status = 200
force = true

[[redirects]]
from = "/generate-music"
to = "https://samuel-ai-tools-app.onrender.com/generate-music"
status = 200
force = true

[[redirects]]
from = "/Resources"
to = "https://samuel-ai-tools-app.onrender.com/Resources"
status = 200
force = true

[[redirects]]
from = "/Ethiopian_Knowledge_AI_Assistant"
to = "https://samuel-ai-tools-app.onrender.com/Ethiopian_Knowledge_AI_Assistant"
status = 200
force = true

# Fallback: serve index.html for unknown paths (home page SPA fallback)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
