[build]
publish = "public"
command = "echo 'Frontend deployment'"

[build.environment]
NODE_VERSION = "20"
SKIP_DEPS = "true"

# Proxy API and backend routes to the Render backend so Netlify serves frontend only
[[redirects]]
from = "/api/*"
to = "https://samuel-ai-tools-app.onrender.com/api/:splat"
status = 200
force = true

[[redirects]]
from = "/Tools/*"
to = "https://samuel-ai-tools-app.onrender.com/Tools/:splat"
status = 200
force = true

[[redirects]]
from = "/Games/*"
to = "https://samuel-ai-tools-app.onrender.com/Games/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
