[build]
# Tell Netlify to serve static files from the public directory
publish = "public"
# Don't try to build anything - just serve static files
command = "echo 'Frontend deployment'"

# Redirect all API calls to your Render backend
[[redirects]]
from = "/api/*"
to = "https://your-render-backend.onrender.com/api/:splat"
status = 200

# Redirect root API calls to backend
[[redirects]]
from = "/*"
to = "https://your-render-backend.onrender.com/:splat"
status = 200
conditions = { Path = ["/api/*"] }

# SPA fallback - route to index.html for client-side routing
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
