<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amharic Link Shortner - AI Tools App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/amharic_link_shortner.css') }}">
</head>
<body>
  {% include "_global_ui.html" %}

    <main class="page">
        <h1 class="title">Ethiopic Links</h1>
        <p class="subtitle">
            Paste a long URL and generate a short link using Ethiopic characters. The tool creates
            a random Amharic short code between 3 and 6 characters and stores links in JSON.
        </p>

        <section class="card">
            <label class="label" for="long-url-input">Enter Link to Shorten</label>
            <input
                id="long-url-input"
                type="url"
                placeholder="ex. https://google.com/maps"
                autocomplete="off"
                spellcheck="false"
            >

            <div class="actions">
                <button id="generate-btn" type="button">Generate</button>
            </div>

            <p id="error" class="error hidden"></p>

            <article id="result-card" class="result-card hidden" aria-live="polite">
                <a id="short-url-link" class="short-url" href="#" target="_blank" rel="noopener"></a>
                <button id="copy-btn" class="copy-btn" type="button">Copy</button>
            </article>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/amharic_link_shortner.js') }}"></script>
</body>
</html>
