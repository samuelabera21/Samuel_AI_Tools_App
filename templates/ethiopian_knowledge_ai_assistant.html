<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
  <title>Ethiopian Knowledge AI Assistant - ፍኖት Ethiopian AI HUB</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ethiopian_knowledge_ai_assistant.css') }}">
</head>
<body>
  {% include "_tools_nav_chat.html" %}

  <main class="knowledge-chat-page">
    <section class="assistant-shell">
      <header class="assistant-header">
        <h1>Ethiopian Knowledge AI Assistant</h1>
        <p>Hi i am ፍኖት Ethiopian AI HUB knowledge assistant</p>
      </header>

      <section class="knowledge-tools">
        <button id="toggle-ingest" class="tool-toggle" type="button" aria-expanded="false" aria-controls="ingest-drawer">
          Add PDF or URL Sources
        </button>

        <div id="ingest-drawer" class="ingest-drawer" hidden>
          <form id="ingest-form" class="ingest-form" enctype="multipart/form-data">
            <label for="files">Upload files (.pdf, .txt, .md)</label>
            <input type="file" name="files" id="files" multiple accept=".pdf,.txt,.md">

            <label for="urls">Add URLs (one per line)</label>
            <textarea id="urls" name="urls" rows="4" placeholder="https://en.wikipedia.org/wiki/Ethiopian_calendar"></textarea>

            <button type="submit" class="btn">Index Knowledge</button>
          </form>
          <p id="ingest-status" class="status"></p>
        </div>
      </section>

      <section class="chat-area" aria-label="Knowledge chat conversation">
        <div id="chat-log" class="chat-log">
          <article class="chat-msg assistant">
            Hi i am ፍኖት Ethiopian AI HUB knowledge assistant. Add a URL or PDF if you want, then ask any question.
          </article>
        </div>

        <div class="examples">
          <button type="button" class="chip" data-q="What is the Ethiopian calendar?">Ethiopian calendar</button>
          <button type="button" class="chip" data-q="Explain Ethiopian coffee ceremony">Coffee ceremony</button>
          <button type="button" class="chip" data-q="How does Ethiopian phone numbering work?">Phone numbering</button>
        </div>

        <form id="ask-form" class="ask-row" autocomplete="off">
          <input type="text" id="question" placeholder="Ask your question..." required>
          <button type="submit" class="btn">Send</button>
        </form>

        <details id="sources-details" class="sources-details" hidden>
          <summary>View source references (optional)</summary>
          <div id="sources" class="sources"></div>
        </details>
      </section>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/ethiopian_knowledge_ai_assistant.js') }}"></script>
</body>
</html>
