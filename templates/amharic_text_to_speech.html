<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amharic Text-to-Speech - ፍኖት Ethiopian AI HUB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/amharic_text_to_speech.css') }}">
</head>
<body>
      {% include "_tools_nav_chat.html" %}

    <main class="page">
        <h1 class="title">Amharic Text-to-Speech</h1>
        <p class="subtitle">
            Convert your Amharic text into natural voice in seconds. Type your content, choose a voice,
            then play or download the generated audio.
        </p>

        <section class="card">
            <textarea id="tts-text" rows="5" placeholder="Start typing here ... እዚህ መጻፍ ይጀምሩ ..."></textarea>

            <label class="switch-row">
                <input id="enable-keyboard" type="checkbox">
                <span>Enable Amharic Keyboard</span>
            </label>

            <div class="voice-row">
                <label for="voice-select">Voice:</label>
                <select id="voice-select">
                    <option value="male">Gender: Male - Name: Ameha</option>
                    <option value="female">Gender: Female - Name: Mekdes</option>
                </select>
            </div>

            <div class="actions">
                <button id="generate-btn" type="button">Generate</button>
            </div>

            <p id="error" class="error hidden"></p>
        </section>

        <section id="audio-result" class="audio-result hidden" aria-live="polite">
            <audio id="audio-player" controls></audio>
            <a id="download-audio" class="download-btn" href="#" download="amharic_tts.mp3" aria-label="Download generated audio">⬇</a>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/amharic_text_to_speech.js') }}"></script>
</body>
</html>
