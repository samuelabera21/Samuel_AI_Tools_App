<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethiopian Baby Name Generator - AI Tools App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ethiopian_name_generator.css') }}">
</head>
<body>
      {% include "_tools_nav_chat.html" %}

    <main class="page">
        <h1 class="title">Ethiopian Baby Name Generator</h1>
        <p class="subtitle">
            Generate real Ethiopian baby names by gender. Each result includes Ethiopic and English spelling,
            a pronunciation player, a copy button, and quick generate-again flow.
        </p>

        <section class="card">
            <p class="label">I'm looking for a</p>
            <div class="filters">
                <label class="gender-option">
                    <input type="radio" name="gender" value="boy">
                    <span>boy name</span>
                </label>
                <label class="gender-option">
                    <input type="radio" name="gender" value="girl" checked>
                    <span>girl name</span>
                </label>
            </div>

            <div class="actions">
                <button id="generate-btn" type="button">Generate</button>
            </div>

            <p id="error" class="error hidden"></p>
            <p id="warning" class="warning hidden"></p>

            <article id="result-card" class="result-card hidden" aria-live="polite">
                <div id="name-amharic" class="name-amharic"></div>
                <div id="name-english" class="name-english"></div>

                <div class="result-actions">
                    <audio id="name-audio" controls></audio>
                    <button id="copy-btn" class="icon-btn" type="button" title="Copy name">📋</button>
                </div>

                <button id="generate-again-btn" class="again-btn" type="button">Generate Again</button>
            </article>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/ethiopian_name_generator.js') }}"></script>
</body>
</html>
