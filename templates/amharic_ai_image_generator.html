<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <title>Amharic AI Prompt to Image Generator - AI Tools App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/amharic_ai_image_generator.css') }}">
</head>
<body>
      {% include "_tools_nav_chat.html" %}

    <main class="image-chat-page">
        <section class="hero-block">
            <h1 class="title">Amharic AI Prompt to Image Generator</h1>
            <p class="subtitle">Create images from Amharic meaning, not text rendering.</p>
        </section>

        <section class="chat-workspace">
            <section id="chat-thread" class="chat-thread" aria-live="polite">
                <article class="assistant-intro">
                    <p>Describe your image in Amharic or English and I will generate it.</p>
                </article>

                <article id="user-message" class="chat-message user hidden">
                    <div class="chat-bubble prompt-bubble">
                        <p class="chat-label">You</p>
                        <p id="user-prompt-text" class="chat-text"></p>
                    </div>
                </article>

                <article id="loading-message" class="chat-message assistant hidden">
                    <div class="chat-bubble status-bubble">
                        <p class="chat-label">ፍኖት AI Image</p>
                        <span id="loading" class="loading">Creating your image...</span>
                    </div>
                </article>

                <article id="assistant-message" class="chat-message assistant hidden">
                    <div class="chat-bubble image-bubble">
                        <div class="assistant-head">
                            <p class="chat-label">ፍኖት AI Image</p>
                            <a id="download-link" class="btn-secondary" href="#" download="amharic-ai-image.png">Download</a>
                        </div>
                        <img id="generated-image" alt="Generated image from Amharic prompt">
                    </div>
                </article>
            </section>

            <div class="composer">
                <div class="composer-actions">
                    <button id="toggle-settings" class="settings-btn" type="button" aria-expanded="false" aria-controls="advanced-settings">Settings</button>
                </div>

                <div id="advanced-settings" class="advanced-settings hidden">
                    <div class="row">
                        <label class="field">
                            <span>Image Size</span>
                            <select id="size">
                                <option value="1024x1024" selected>1024 x 1024 (Recommended)</option>
                            </select>
                        </label>

                        <label class="field">
                            <span>Style (Optional)</span>
                            <input id="style" type="text" placeholder="cinematic, watercolor, photorealistic">
                        </label>
                    </div>
                </div>

                <div class="prompt-row">
                    <textarea id="prompt" rows="2" placeholder="Describe your image..."></textarea>
                    <button id="generate-btn" class="btn-primary" type="button">Generate</button>
                </div>
                <p id="provider-warning" class="error hidden"></p>
                <p id="error" class="error hidden"></p>
            </div>
        </section>
    </main>

    <script>
        const promptEl = document.getElementById("prompt");
        const sizeEl = document.getElementById("size");
        const styleEl = document.getElementById("style");
        const generateButton = document.getElementById("generate-btn");
        const loadingEl = document.getElementById("loading");
        const errorEl = document.getElementById("error");
        const userMessageEl = document.getElementById("user-message");
        const userPromptTextEl = document.getElementById("user-prompt-text");
        const assistantMessageEl = document.getElementById("assistant-message");
        const loadingMessageEl = document.getElementById("loading-message");
        const chatThreadEl = document.getElementById("chat-thread");
        const imageEl = document.getElementById("generated-image");
        const downloadLink = document.getElementById("download-link");
        const providerWarningEl = document.getElementById("provider-warning");
        const toggleSettingsBtn = document.getElementById("toggle-settings");
        const advancedSettingsEl = document.getElementById("advanced-settings");

        toggleSettingsBtn.addEventListener("click", () => {
            const isHidden = advancedSettingsEl.classList.contains("hidden");
            advancedSettingsEl.classList.toggle("hidden", !isHidden);
            toggleSettingsBtn.setAttribute("aria-expanded", String(isHidden));
        });

        function setLoading(isLoading) {
            generateButton.disabled = isLoading;
            loadingMessageEl.classList.toggle("hidden", !isLoading);
            if (isLoading) {
                errorEl.classList.add("hidden");
                providerWarningEl.classList.add("hidden");
            }
        }

        function showError(message) {
            errorEl.textContent = message;
            errorEl.classList.remove("hidden");
        }

        function scrollChatToBottom() {
            chatThreadEl.scrollTop = chatThreadEl.scrollHeight;
        }

        async function generateImage() {
            const prompt = promptEl.value.trim();
            if (!prompt) {
                showError("Please enter an Amharic prompt first.");
                return;
            }

            userPromptTextEl.textContent = prompt;
            userMessageEl.classList.remove("hidden");
            assistantMessageEl.classList.add("hidden");
            setLoading(true);
            scrollChatToBottom();

            try {
                const response = await fetch("/api/amharic-ai-image", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        prompt,
                        size: sizeEl.value,
                        style: styleEl.value.trim()
                    })
                });

                const responseText = await response.text();
                let data = {};
                try {
                    data = responseText ? JSON.parse(responseText) : {};
                } catch (parseError) {
                    if (!response.ok) {
                        throw new Error("Image service returned a non-JSON error. Please try again in a few seconds.");
                    }
                    throw new Error("Unexpected response from image service.");
                }

                if (!response.ok) {
                    throw new Error(data.error || "Image generation failed.");
                }

                imageEl.src = data.imageUrl;
                downloadLink.href = data.imageUrl;
                assistantMessageEl.classList.remove("hidden");
                errorEl.classList.add("hidden");
                if (data.warning) {
                    providerWarningEl.textContent = data.warning;
                    providerWarningEl.classList.remove("hidden");
                } else {
                    providerWarningEl.classList.add("hidden");
                }
                scrollChatToBottom();
            } catch (error) {
                showError(error.message || "Unable to generate image right now.");
            } finally {
                setLoading(false);
            }
        }

        generateButton.addEventListener("click", generateImage);
        promptEl.addEventListener("keydown", (event) => {
            if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
                generateImage();
            }
        });
    </script>
</body>
</html>
