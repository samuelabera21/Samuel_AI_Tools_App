<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
  <title>Amharic Music Generator - ፍኖት Ethiopian AI HUB</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/music.css') }}">
</head>
<body>
  {% include "_tools_nav_chat.html" %}

  <main class="music-page">
    <div class="studio-shell">
      <aside class="studio-rail">
        <h1>Create Music</h1>
        <p>Compose Ethiopian-inspired instrumental tracks from text prompts.</p>
        <ul class="rail-list">
          <li class="active">Prompt Composer</li>
          <li>Generation Settings</li>
          <li>Output Preview</li>
        </ul>
      </aside>

      <section class="studio-main">
        <header class="composer-bar">
          <p>Describe your music idea in Amharic or English.</p>
        </header>

        <section class="music-card">
          <form id="music-form" class="music-form" novalidate>
            <label for="prompt">Music Idea</label>
            <textarea id="prompt" name="prompt" rows="4" placeholder="Example: ፍቅር ዘፈን or Emotional Ethiopian sunset jazz" required></textarea>

            <div class="form-row">
              <div class="field">
                <label for="style">Style</label>
                <select id="style" name="style">
                  <option value="traditional_ethiopian">Traditional Ethiopian</option>
                  <option value="jazz">Jazz</option>
                  <option value="hip_hop">Hip Hop</option>
                  <option value="gospel">Gospel</option>
                </select>
              </div>

              <div class="field">
                <label for="duration">Duration</label>
                <select id="duration" name="duration">
                  <option value="5">5 seconds</option>
                  <option value="10" selected>10 seconds</option>
                  <option value="20">20 seconds</option>
                </select>
              </div>
            </div>

            <button id="generate-btn" type="submit">Generate Music</button>
          </form>

          <p id="status" class="status" role="status" aria-live="polite"></p>
          <p id="error" class="error" role="alert" hidden></p>

          <section id="result" class="result" hidden>
            <h2>Your Generated Track</h2>
            <audio id="audio-player" controls></audio>
            <a id="download-link" class="download-btn" href="#" download>Download Audio</a>
            <p class="enhanced-label">AI Prompt Used:</p>
            <p id="enhanced-prompt" class="enhanced-prompt"></p>
          </section>
        </section>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById('music-form');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const resultEl = document.getElementById('result');
    const audioPlayer = document.getElementById('audio-player');
    const downloadLink = document.getElementById('download-link');
    const enhancedPromptEl = document.getElementById('enhanced-prompt');
    const generateBtn = document.getElementById('generate-btn');

    function resetMessages() {
      statusEl.textContent = '';
      errorEl.hidden = true;
      errorEl.textContent = '';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      resetMessages();
      resultEl.hidden = true;

      const prompt = document.getElementById('prompt').value.trim();
      const style = document.getElementById('style').value;
      const duration = Number(document.getElementById('duration').value);

      if (!prompt) {
        errorEl.hidden = false;
        errorEl.textContent = 'Please enter a music idea first.';
        return;
      }

      generateBtn.disabled = true;
      statusEl.textContent = 'Generating music... The first run may take 1-3 minutes while the model loads.';

      try {
        const response = await fetch('/generate-music', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ prompt, style, duration })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Music generation failed.');
        }

        audioPlayer.src = data.audioUrl;
        audioPlayer.load();
        downloadLink.href = data.audioUrl;
        downloadLink.setAttribute('download', data.filename || 'generated_music.wav');
        enhancedPromptEl.textContent = data.enhancedPrompt || '';
        resultEl.hidden = false;
        statusEl.textContent = 'Music generated successfully.';
      } catch (error) {
        errorEl.hidden = false;
        errorEl.textContent = error.message || 'Something went wrong. Please try again.';
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
