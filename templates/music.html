<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
  <title>Amharic Music Generator - ፍኖት Ethiopian AI HUB</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/music.css') }}">
</head>
<body>
  {% include "_tools_nav_chat.html" %}

  <main class="music-page">
    <div class="studio-shell">
      <aside class="studio-rail">
        <h1>Create Music</h1>
        <p>Compose Ethiopian-inspired instrumental tracks from text prompts.</p>
        <ul class="rail-list">
          <li>
            <button type="button" class="rail-step active" data-step="prompt" data-target="prompt-section">Prompt Composer</button>
          </li>
          <li>
            <button type="button" class="rail-step" data-step="settings" data-target="settings-section">Generation Settings</button>
          </li>
          <li>
            <button type="button" class="rail-step" data-step="preview" data-target="result">Output Preview</button>
          </li>
        </ul>
      </aside>

      <section class="studio-main">
        <header class="composer-bar">
          <p>
            {% if music_enabled %}
              Describe your music idea in Amharic or English.
            {% else %}
              {{ music_disabled_message }}
            {% endif %}
          </p>
        </header>

        <section class="music-card">
          <form id="music-form" class="music-form" novalidate>
            <div id="prompt-section" class="field-block">
              <label for="prompt">Music Idea</label>
              <textarea id="prompt" name="prompt" rows="4" placeholder="Example: ፍቅር ዘፈን or Emotional Ethiopian sunset jazz" required {% if not music_enabled %}disabled{% endif %}></textarea>
            </div>

            <div id="settings-section" class="form-row field-block">
              <div class="field">
                <label for="style">Style</label>
                <select id="style" name="style" {% if not music_enabled %}disabled{% endif %}>
                  <option value="traditional_ethiopian">Traditional Ethiopian</option>
                  <option value="jazz">Jazz</option>
                  <option value="hip_hop">Hip Hop</option>
                  <option value="gospel">Gospel</option>
                </select>
              </div>

              <div class="field">
                <label for="duration">Duration</label>
                <select id="duration" name="duration" {% if not music_enabled %}disabled{% endif %}>
                  <option value="5">5 seconds</option>
                  <option value="10" selected>10 seconds</option>
                  <option value="20">20 seconds</option>
                </select>
              </div>
            </div>

            <button id="generate-btn" type="submit" {% if not music_enabled %}disabled{% endif %}>Generate Music</button>
          </form>

          <p id="status" class="status" role="status" aria-live="polite"></p>
          <p id="error" class="error" role="alert" hidden></p>

          <section id="result" class="result" hidden>
            <h2>Your Generated Track</h2>
            <audio id="audio-player" controls></audio>
            <a id="download-link" class="download-btn" href="#" download>Download Audio</a>
            <p class="enhanced-label">AI Prompt Used:</p>
            <p id="enhanced-prompt" class="enhanced-prompt"></p>
          </section>
        </section>
      </section>
    </div>
  </main>

  <script>
    const musicEnabled = {{ 'true' if music_enabled else 'false' }};
    const musicDisabledMessage = {{ music_disabled_message|tojson }};
    const form = document.getElementById('music-form');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const resultEl = document.getElementById('result');
    const audioPlayer = document.getElementById('audio-player');
    const downloadLink = document.getElementById('download-link');
    const enhancedPromptEl = document.getElementById('enhanced-prompt');
    const generateBtn = document.getElementById('generate-btn');
    const railSteps = document.querySelectorAll('.rail-step');
    let audioFallbackTried = false;

    function setActiveStep(stepName) {
      railSteps.forEach((stepBtn) => {
        stepBtn.classList.toggle('active', stepBtn.dataset.step === stepName);
      });
    }

    railSteps.forEach((stepBtn) => {
      stepBtn.addEventListener('click', () => {
        const targetId = stepBtn.dataset.target;
        const targetEl = document.getElementById(targetId);

        if (!musicEnabled) {
          statusEl.textContent = musicDisabledMessage;
          errorEl.hidden = true;
          return;
        }

        if (stepBtn.dataset.step === 'preview' && resultEl.hidden) {
          statusEl.textContent = 'Generate music first to preview output.';
          errorEl.hidden = true;
          return;
        }

        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        setActiveStep(stepBtn.dataset.step);
      });
    });

    document.getElementById('prompt').addEventListener('focus', () => setActiveStep('prompt'));
    document.getElementById('style').addEventListener('focus', () => setActiveStep('settings'));
    document.getElementById('duration').addEventListener('focus', () => setActiveStep('settings'));

    audioPlayer.addEventListener('error', () => {
      if (audioFallbackTried) {
        return;
      }

      const fallbackFile = downloadLink.getAttribute('data-filename');
      if (!fallbackFile) {
        return;
      }

      audioFallbackTried = true;
      const fallbackUrl = `/static/audio/${fallbackFile}`;
      audioPlayer.src = fallbackUrl;
      audioPlayer.load();
      downloadLink.href = fallbackUrl;
      statusEl.textContent = 'Switched to compatibility audio path.';
    });

    function resetMessages() {
      statusEl.textContent = '';
      errorEl.hidden = true;
      errorEl.textContent = '';
    }

    if (!musicEnabled) {
      statusEl.textContent = musicDisabledMessage;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!musicEnabled) {
        errorEl.hidden = false;
        errorEl.textContent = musicDisabledMessage;
        return;
      }

      resetMessages();
      resultEl.hidden = true;

      const prompt = document.getElementById('prompt').value.trim();
      const style = document.getElementById('style').value;
      const duration = Number(document.getElementById('duration').value);

      if (!prompt) {
        errorEl.hidden = false;
        errorEl.textContent = 'Please enter a music idea first.';
        return;
      }

      generateBtn.disabled = true;
      statusEl.textContent = 'Generating music... The first run may take 1-3 minutes while the model loads.';

      try {
        const response = await fetch('/generate-music', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ prompt, style, duration })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Music generation failed.');
        }

        audioFallbackTried = false;
        audioPlayer.src = data.audioUrl;
        audioPlayer.load();
        downloadLink.href = data.audioUrl;
        downloadLink.setAttribute('download', data.filename || 'generated_music.wav');
        downloadLink.setAttribute('data-filename', data.filename || '');
        enhancedPromptEl.textContent = data.enhancedPrompt || '';
        resultEl.hidden = false;
        statusEl.textContent = 'Music generated successfully.';
        setActiveStep('preview');
        resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (error) {
        errorEl.hidden = false;
        errorEl.textContent = error.message || 'Something went wrong. Please try again.';
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
