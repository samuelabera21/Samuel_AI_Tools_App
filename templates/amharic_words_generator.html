<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Amharic Words Generator - AI Tools App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/amharic_words_generator.css') }}">
</head>
<body>
      {% include "_tools_nav_chat.html" %>

    <main class="page">
        <h1 class="title">Random Amharic Words Generator</h1>
        <p class="subtitle">Looking for random Amharic words? This free online tool can generate unique random Amharic words and display output in different styles.</p>

        <section class="card">
            <div class="controls">
                <label>
                    <span>How many words?</span>
                    <select id="count-select">
                        <option value="1">1</option>
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                    </select>
                </label>

                <label>
                    <span>Words starting with:</span>
                    <select id="prefix-select">
                        {% for item in prefix_options %}
                        <option value="{{ item.key }}">{{ item.label }}</option>
                        {% endfor %}
                    </select>
                </label>

                <label>
                    <span>Output style:</span>
                    <select id="style-select">
                        <option value="bulleted" selected>Bulleted list</option>
                        <option value="numbered">Numbered list</option>
                        <option value="paragraph">Paragraph</option>
                        <option value="table">table</option>
                    </select>
                </label>

                <label>
                    <span>Word order:</span>
                    <select id="order-select">
                        <option value="random" selected>Random</option>
                        <option value="alphabetical">Amharic alphabetical</option>
                    </select>
                </label>

                <button id="generate-btn" type="button">Generate</button>
            </div>

            <p id="error" class="error hidden"></p>

            <div id="result-wrap" class="result-wrap hidden">
                <div id="result-output" class="result-output"></div>
                <button id="copy-btn" class="copy-btn" type="button" title="Copy result">📋</button>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/amharic_words_generator.js') }}"></script>
</body>
</html>
