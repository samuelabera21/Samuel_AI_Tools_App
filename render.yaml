services:
  - type: web
    name: ai-tools-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_CHAT_MODEL
        value: nvidia/nemotron-3-nano-30b-a3b
      - key: NVIDIA_EMBEDDING_MODEL
        value: nvidia/nv-embedqa-e5-v5
      - key: RAG_CHUNK_SIZE
        value: 900
      - key: RAG_CHUNK_OVERLAP
        value: 150
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: SHORT_LINK_PUBLIC_BASE_URL
        value: ""
      - key: APP_PROFILE
        value: production-lite
      - key: ENABLE_MUSIC_GENERATION
        value: "false"
      - key: MUSIC_DISABLED_MESSAGE
        value: Music generation is disabled on this free deployment profile.
      - key: AUDIO_STORAGE_DIR
        value: /opt/render/project/src/data/generated_audio
      - key: AUDIO_RETENTION_HOURS
        value: 168

disks:
  - name: ai-tools-rag-data
    mountPath: /opt/render/project/src/tools/ethiopian_knowledge_assistant/data
    sizeGB: 1
  - name: ai-tools-audio-data
    mountPath: /opt/render/project/src/data/generated_audio
    sizeGB: 2
